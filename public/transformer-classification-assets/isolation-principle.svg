<svg xmlns="http://www.w3.org/2000/svg" viewBox="65 80 665 220" role="img" aria-labelledby="mT mD">
          <style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif}</style><title id="mT">变压器的四步工作过程</title>
          <desc id="mD">一次线圈通入交流电，铁芯中产生交变磁通，磁通穿过二次线圈并感应出电压，接上负载后二次侧出现电流，但电荷没有跨过两个线圈之间的间隙。</desc>

          <!-- 铁芯 + 磁通 -->
          <g data-hl="2">
            <rect x="270" y="96" width="220" height="190" fill="none" stroke="#c9c2b4" stroke-width="22"/>
            <rect x="270" y="96" width="220" height="190" fill="none" stroke="#4a5bc4" stroke-width="3"
                  class="flux-ring" opacity=".85"/>
            <path d="M318 89 L334 96 L318 103 Z" fill="#4a5bc4"/>
            <path d="M442 279 L426 286 L442 293 Z" fill="#4a5bc4"/>
            
          </g>

          <text x="380" y="166" text-anchor="middle" font-size="22" fill="#4a5bc4">交变磁通 Φ</text><text x="380" y="207" text-anchor="middle" font-size="20" fill="#58716c">无导线跨接</text><!-- 一次 -->
          <g data-hl="1">
            <g fill="#fff" stroke="#cf4630" stroke-width="2.8">
              <ellipse cx="270" cy="121" rx="23" ry="7.5"/>
              <ellipse cx="270" cy="141" rx="23" ry="7.5"/>
              <ellipse cx="270" cy="161" rx="23" ry="7.5"/>
              <ellipse cx="270" cy="181" rx="23" ry="7.5"/>
              <ellipse cx="270" cy="201" rx="23" ry="7.5"/>
              <ellipse cx="270" cy="221" rx="23" ry="7.5"/>
              <ellipse cx="270" cy="241" rx="23" ry="7.5"/>
              <ellipse cx="270" cy="261" rx="23" ry="7.5"/>
            </g>
            <path d="M247 121 H112 V151" fill="none" stroke="#cf4630" stroke-width="2.8"/>
            <path d="M247 261 H112 V219" fill="none" stroke="#cf4630" stroke-width="2.8"/>
            <circle cx="112" cy="185" r="34" fill="#fff" stroke="#cf4630" stroke-width="2.8"/>
            <path d="M94 185 q9 -14 18 0 q9 14 18 0" fill="none" stroke="#cf4630" stroke-width="2.6" stroke-linecap="round"/>
          </g>

          <!-- 二次 -->
          <g data-hl="3">
            <g fill="#fff" stroke="#0f8478" stroke-width="2.8">
              <ellipse cx="490" cy="121" rx="23" ry="7.5"/>
              <ellipse cx="490" cy="141" rx="23" ry="7.5"/>
              <ellipse cx="490" cy="161" rx="23" ry="7.5"/>
              <ellipse cx="490" cy="181" rx="23" ry="7.5"/>
              <ellipse cx="490" cy="201" rx="23" ry="7.5"/>
              <ellipse cx="490" cy="221" rx="23" ry="7.5"/>
              <ellipse cx="490" cy="241" rx="23" ry="7.5"/>
              <ellipse cx="490" cy="261" rx="23" ry="7.5"/>
            </g>
            <path d="M513 121 H560" fill="none" stroke="#0f8478" stroke-width="2.8"/>
            <path d="M513 261 H560" fill="none" stroke="#0f8478" stroke-width="2.8"/>
            <circle cx="560" cy="121" r="5.5" fill="#fff" stroke="#0f8478" stroke-width="2.8"/>
            <circle cx="560" cy="261" r="5.5" fill="#fff" stroke="#0f8478" stroke-width="2.8"/>
            
          </g>

          <!-- 负载 -->
          <g data-hl="4">
            <path d="M560 121 H610" fill="none" stroke="#0f8478" stroke-width="2.8" stroke-dasharray="7 6"/>
            <path d="M560 261 H610" fill="none" stroke="#0f8478" stroke-width="2.8" stroke-dasharray="7 6"/>
            <rect x="610" y="106" width="90" height="170" rx="12" fill="#fff" stroke="#49515f" stroke-width="2.8"/>
            <text x="655" y="198" font-size="21" fill="#49515f" text-anchor="middle" font-weight="700">负载</text>
            
          </g>
        </svg>
